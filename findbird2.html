<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBS-PAS (Batch Processing Engine)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #0f172a; color: #f8fafc; }
        #video-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; border-radius: 0.5rem; border: 1px solid #334155; }
        video { width: 100%; height: 100%; outline: none; }
        .log-panel::-webkit-scrollbar { width: 6px; }
        .log-panel::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        /* 로딩 스피너 오버레이 */
        #loading-overlay { display: none; position: absolute; inset: 0; background: rgba(15, 23, 42, 0.8); z-index: 50; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-6 items-center">

    <div class="w-full max-w-7xl grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- 좌측: 영상 제어 및 뷰어 -->
        <div class="lg:col-span-2 space-y-4">
            
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
                <div>
                    <h1 class="font-bold text-xl text-indigo-400">YOLOv11 배치 프로세싱 엔진</h1>
                    <p class="text-xs text-slate-400">영상 파일 일괄 전송 ➔ 서버 렌더링 ➔ 동기화 재생 및 로그 출력</p>
                </div>
            </div>

            <!-- 서버 URL 입력 (REST API) -->
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <label class="block text-xs text-slate-400 font-semibold mb-1">1. Colab 서버 URL (https://...)</label>
                <input type="text" id="api-url-input" placeholder="ngrok 주소를 입력하세요 (https://...)" class="w-full px-4 py-2 bg-slate-950 text-white rounded-md border border-slate-700 text-sm">
            </div>

            <!-- 파일 업로드 및 분석 제어 -->
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex flex-wrap gap-4 items-end">
                <div class="flex-grow">
                    <label class="block text-xs text-slate-400 font-semibold mb-1">2. 분석할 영상 업로드 (.mp4)</label>
                    <input type="file" id="video-upload" accept="video/mp4" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:bg-slate-800 file:text-slate-300 hover:file:bg-slate-700 bg-slate-950 border border-slate-700 rounded-md">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 font-semibold mb-1">EO 광학 배율</label>
                    <select id="zoom-level" class="block w-full px-4 py-2 bg-slate-950 border border-slate-700 rounded-md text-sm text-white focus:outline-none">
                        <option value="15">15배 줌 (x15)</option>
                        <option value="30">30배 줌 (x30)</option>
                    </select>
                </div>
                <button id="btn-analyze" disabled class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold rounded-md disabled:opacity-50 transition-colors">
                    전송 및 분석
                </button>
            </div>

            <!-- 비디오 뷰포트 -->
            <div id="video-container">
                <video id="result-video" controls playsinline></video>
                
                <!-- 대기 화면 -->
                <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 z-0 bg-black">
                    <i class="fa-solid fa-cloud-arrow-up text-4xl mb-3"></i>
                    <p class="text-sm">영상을 전송하면 서버가 분석 후 결과를 반환합니다.</p>
                </div>

                <!-- 분석 중 로딩 오버레이 -->
                <div id="loading-overlay">
                    <i class="fa-solid fa-circle-notch fa-spin text-indigo-500 text-5xl mb-4"></i>
                    <p class="text-white font-bold mb-1">서버에서 영상을 분석 중입니다...</p>
                    <p class="text-slate-400 text-xs">영상의 길이에 따라 수십 초가 소요될 수 있습니다.</p>
                </div>
            </div>
        </div>

        <!-- 우측: 분석 결과 로그 패널 -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl flex flex-col h-full overflow-hidden max-h-[800px]">
            <div class="p-4 border-b border-slate-800 bg-slate-950 flex justify-between items-center">
                <h2 class="text-sm font-bold text-slate-200">
                    <i class="fa-solid fa-list-check text-indigo-400"></i> 탐지 정보 로그 (Detection Logs)
                </h2>
                <span id="log-count" class="text-xs text-amber-400 font-bold bg-amber-500/10 px-2 py-1 rounded">데이터 대기중</span>
            </div>
            
            <div class="overflow-y-auto p-4 log-panel h-full" id="log-container">
                <p class="text-slate-500 text-center text-sm mt-10">분석이 완료되면 이 곳에 조류 탐지 기록, 거리, 크기 정보가 출력됩니다.</p>
            </div>
        </div>
    </div>

    <script>
        const apiUrlInput = document.getElementById('api-url-input');
        const videoUpload = document.getElementById('video-upload');
        const zoomSelect = document.getElementById('zoom-level');
        const btnAnalyze = document.getElementById('btn-analyze');
        
        const resultVideo = document.getElementById('result-video');
        const emptyState = document.getElementById('empty-state');
        const loadingOverlay = document.getElementById('loading-overlay');
        
        const logContainer = document.getElementById('log-container');
        const logCount = document.getElementById('log-count');

        let selectedFile = null;

        videoUpload.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                selectedFile = e.target.files[0];
                btnAnalyze.disabled = false;
            }
        });

        btnAnalyze.addEventListener('click', async () => {
            const baseUrl = apiUrlInput.value.trim();
            if (!baseUrl.startsWith('http')) return alert('올바른 서버 URL(https://...)을 입력하세요.');
            if (!selectedFile) return alert('영상을 업로드하세요.');

            // UI 상태 변경 (로딩 시작)
            btnAnalyze.disabled = true;
            emptyState.style.display = "none";
            loadingOverlay.style.display = "flex";
            logContainer.innerHTML = ''; // 기존 로그 초기화
            logCount.textContent = '분석 중...';
            resultVideo.src = "";

            // 서버로 보낼 FormData 생성
            const formData = new FormData();
            formData.append("file", selectedFile);
            formData.append("zoom", zoomSelect.value);

            try {
                // REST API POST 요청
                const response = await fetch(`${baseUrl}/analyze`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('서버 처리 에러');

                const data = await response.json(); // 반환된 JSON 파싱

                // 1. 반환된 처리 완료 영상 URL을 비디오 태그에 세팅
                resultVideo.src = `${baseUrl}${data.video_url}`;
                resultVideo.play();

                // 2. 우측 패널에 탐지 로그 렌더링
                renderLogs(data.logs);

            } catch (error) {
                console.error(error);
                alert("영상 분석 중 오류가 발생했습니다. 서버 상태를 확인하세요.");
                emptyState.style.display = "flex";
            } finally {
                // UI 상태 복구 (로딩 끝)
                btnAnalyze.disabled = false;
                loadingOverlay.style.display = "none";
            }
        });

        // JSON 로그 데이터를 읽어서 우측 패널에 HTML로 이쁘게 그려주는 함수
        function renderLogs(logs) {
            if (logs.length === 0) {
                logContainer.innerHTML = `<p class="text-slate-500 text-center text-sm mt-10">해당 영상에서 탐지된 조류가 없습니다.</p>`;
                logCount.textContent = `0건 탐지`;
                return;
            }

            let htmlString = `<div class="space-y-3">`;
            let totalDetections = 0;

            logs.forEach(log => {
                totalDetections += log.detections.length;
                htmlString += `
                    <div class="bg-slate-950 border border-slate-800 p-3 rounded-lg">
                        <div class="flex justify-between items-center mb-2 border-b border-slate-800 pb-2">
                            <span class="text-indigo-400 font-bold text-xs"><i class="fa-regular fa-clock"></i> ${log.time_sec}초 (프레임: ${log.frame})</span>
                            <span class="text-xs text-slate-400">탐지: ${log.detections.length}마리</span>
                        </div>
                `;
                
                log.detections.forEach(det => {
                    let riskColor = det.distance_m < 250 ? "text-red-400" : "text-emerald-400"; // 250m 이내면 위험(빨강)
                    htmlString += `
                        <div class="flex justify-between text-xs text-slate-300 py-1">
                            <span>객체 #${det.id} [${det.confidence}%]</span>
                            <span>크기: ${det.pixel_size}px</span>
                            <span class="font-bold ${riskColor}">거리: ${det.distance_m}m</span>
                        </div>
                    `;
                });
                htmlString += `</div>`;
            });
            htmlString += `</div>`;

            logContainer.innerHTML = htmlString;
            logCount.textContent = `총 ${totalDetections}건 탐지`;
        }
    </script>
</body>
</html>
