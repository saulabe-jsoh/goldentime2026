<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBS-PAS (Server-Side Rendering Ver.)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #0f172a; color: #f8fafc; }
        #video-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 0.5rem; overflow: hidden; border: 1px solid #334155; }
        
        /* 원본 비디오는 백그라운드 처리를 위해 완전히 숨깁니다 */
        video { display: none; } 
        
        /* 서버에서 처리되어 돌아온 이미지를 보여주는 영역 */
        #result-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-6">

    <div class="w-full max-w-5xl space-y-4">
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
            <div>
                <h1 class="font-bold text-xl text-indigo-400">YOLOv11 실시간 영상 관제 (서버 렌더링)</h1>
                <p class="text-xs text-slate-400">완벽한 프레임-박스 동기화 적용</p>
            </div>
            <div id="status-badge" class="px-4 py-2 bg-slate-800 text-slate-400 text-sm font-bold rounded-full border border-slate-700 flex items-center gap-2">
                <div id="status-indicator" class="w-3 h-3 rounded-full bg-slate-500"></div>
                <span id="status-text">대기중</span>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex gap-3 items-end">
            <div class="flex-grow">
                <input type="text" id="ws-url-input" placeholder="wss://..." class="w-full px-4 py-2 bg-slate-950 text-white rounded-md border border-slate-700 text-sm">
            </div>
            <button id="btn-connect" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold rounded-md whitespace-nowrap">연결</button>
        </div>

        <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex flex-wrap gap-4 items-end">
            <div class="flex-grow">
                <input type="file" id="video-upload" accept="video/mp4,video/webm" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:bg-slate-800 file:text-slate-300 bg-slate-950 border border-slate-700 rounded-md">
            </div>
            <button id="btn-analyze" disabled class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold rounded-md disabled:opacity-50">분석 시작</button>
        </div>

        <div id="video-container">
            <video id="video" playsinline muted></video>
            <!-- 캔버스 대신 img 태그 사용 -->
            <img id="result-image" src="" alt="">
            <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 z-0">
                <p class="text-sm">서버 처리된 화면이 여기에 표시됩니다.</p>
            </div>
        </div>
    </div>

    <script>
        const wsUrlInput = document.getElementById('ws-url-input');
        const btnConnect = document.getElementById('btn-connect');
        const videoUpload = document.getElementById('video-upload');
        const btnAnalyze = document.getElementById('btn-analyze');
        
        const video = document.getElementById('video');
        const resultImage = document.getElementById('result-image');
        const emptyState = document.getElementById('empty-state');
        const statusText = document.getElementById('status-text');

        let ws = null;
        let isAnalyzing = false;
        
        const captureCanvas = document.createElement('canvas');
        const captureCtx = captureCanvas.getContext('2d');
        const TARGET_WIDTH = 640; 

        function checkReadyState() {
            btnAnalyze.disabled = !(ws && ws.readyState === WebSocket.OPEN && video.src);
        }

        btnConnect.addEventListener('click', () => {
            const url = wsUrlInput.value.trim();
            if (!url.startsWith('wss://')) return alert("wss:// URL 확인");

            if (ws) ws.close();
            statusText.textContent = "연결 시도 중...";
            
            try {
                ws = new WebSocket(url);
                ws.onopen = () => { statusText.textContent = "연결 완료"; checkReadyState(); };
                
                // ★ 서버에서 완성된 이미지를 받아 화면에 출력 ★
                ws.onmessage = (event) => {
                    if (!isAnalyzing) return;
                    
                    const response = JSON.parse(event.data);
                    
                    // 서버가 보내준 Base64 이미지를 그대로 img 태그에 넣음
                    resultImage.src = response.image;
                    emptyState.style.display = "none";
                    
                    // 다음 프레임 요청 (Ping-Pong)
                    requestAnimationFrame(sendSingleFrame);
                };

                ws.onclose = () => { statusText.textContent = "종료됨"; stopAnalysis(); checkReadyState(); };
                ws.onerror = () => { statusText.textContent = "오류 발생"; stopAnalysis(); checkReadyState(); };
            } catch (error) {}
        });

        videoUpload.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                video.src = URL.createObjectURL(e.target.files[0]);
                video.load();
                video.onloadeddata = checkReadyState;
                video.onended = stopAnalysis;
            }
        });

        btnAnalyze.addEventListener('click', () => {
            if (isAnalyzing) stopAnalysis();
            else startAnalysis();
        });

        function startAnalysis() {
            isAnalyzing = true;
            video.play();
            btnAnalyze.textContent = "분석 중지";
            btnAnalyze.className = "px-6 py-2 bg-red-600 text-white text-sm font-bold rounded-md";
            sendSingleFrame();
        }

        function stopAnalysis() {
            isAnalyzing = false;
            video.pause();
            btnAnalyze.textContent = "분석 시작";
            btnAnalyze.className = "px-6 py-2 bg-emerald-600 text-white text-sm font-bold rounded-md";
        }

        function sendSingleFrame() {
            if (!isAnalyzing || !ws || ws.readyState !== WebSocket.OPEN) return;
            
            const scale = TARGET_WIDTH / video.videoWidth;
            captureCanvas.width = TARGET_WIDTH;
            captureCanvas.height = video.videoHeight * scale;
            
            captureCtx.drawImage(video, 0, 0, captureCanvas.width, captureCanvas.height);
            ws.send(captureCanvas.toDataURL('image/jpeg', 0.6));
        }
    </script>
</body>
</html>
