<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBS-PAS (Batch Processing Engine)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #0f172a; color: #f8fafc; }
        #video-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; border-radius: 0.5rem; border: 1px solid #334155; }
        video { width: 100%; height: 100%; outline: none; }
        .log-panel::-webkit-scrollbar { width: 6px; }
        .log-panel::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        /* 로딩 스피너 오버레이 */
        #loading-overlay { display: none; position: absolute; inset: 0; background: rgba(15, 23, 42, 0.85); z-index: 50; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-6 items-center">

    <div class="w-full max-w-7xl grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="lg:col-span-2 space-y-4">
            
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
                <div>
                    <h1 class="font-bold text-xl text-indigo-400">YOLOv11 배치 프로세싱 엔진</h1>
                    <p class="text-xs text-slate-400">영상 파일 전송 진행률 및 서버 렌더링 동기화</p>
                </div>
            </div>

            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <label class="block text-xs text-slate-400 font-semibold mb-1">1. Colab 서버 URL (https://...)</label>
                <input type="text" id="api-url-input" placeholder="ngrok 주소를 입력하세요 (https://...)" class="w-full px-4 py-2 bg-slate-950 text-white rounded-md border border-slate-700 text-sm focus:outline-none focus:border-indigo-500">
            </div>

            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex flex-wrap gap-4 items-end">
                <div class="flex-grow">
                    <label class="block text-xs text-slate-400 font-semibold mb-1">2. 분석할 영상 업로드 (.mp4)</label>
                    <input type="file" id="video-upload" accept="video/mp4" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:bg-slate-800 file:text-slate-300 hover:file:bg-slate-700 bg-slate-950 border border-slate-700 rounded-md cursor-pointer">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 font-semibold mb-1">EO 광학 배율</label>
                    <select id="zoom-level" class="block w-full px-4 py-2 bg-slate-950 border border-slate-700 rounded-md text-sm text-white focus:outline-none">
                        <option value="15">15배 줌 (x15)</option>
                        <option value="30">30배 줌 (x30)</option>
                    </select>
                </div>
                <button id="btn-analyze" disabled class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold rounded-md disabled:opacity-50 transition-colors whitespace-nowrap">
                    전송 및 분석
                </button>
            </div>

            <div id="video-container">
                <video id="result-video" controls playsinline></video>
                
                <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 z-0 bg-black">
                    <i class="fa-solid fa-cloud-arrow-up text-4xl mb-3"></i>
                    <p class="text-sm">영상을 전송하면 서버가 분석 후 결과를 반환합니다.</p>
                </div>

                <div id="loading-overlay">
                    <i id="loading-spinner" class="fa-solid fa-cloud-arrow-up text-indigo-500 text-5xl mb-4"></i>
                    <p id="loading-text" class="text-white font-bold mb-2">영상을 서버로 전송 중입니다...</p>
                    
                    <div class="w-64 bg-slate-800 rounded-full h-3 mb-2 overflow-hidden border border-slate-700 shadow-inner">
                        <div id="progress-bar" class="bg-gradient-to-r from-indigo-500 to-emerald-400 h-3 rounded-full transition-all duration-300 ease-out" style="width: 0%"></div>
                    </div>
                    <p id="progress-text" class="text-emerald-400 font-mono font-bold text-sm">0%</p>

                    <p class="text-slate-400 text-xs mt-4 text-center px-6">파일 전송 후 서버의 영상 분석 및 인코딩에<br>비디오 길이만큼의 시간이 추가로 소요될 수 있습니다.</p>
                </div>
            </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-xl flex flex-col h-full overflow-hidden max-h-[800px]">
            <div class="p-4 border-b border-slate-800 bg-slate-950 flex justify-between items-center">
                <h2 class="text-sm font-bold text-slate-200">
                    <i class="fa-solid fa-list-check text-indigo-400"></i> 탐지 정보 로그 (Detection Logs)
                </h2>
                <span id="log-count" class="text-xs text-amber-400 font-bold bg-amber-500/10 px-2 py-1 rounded">데이터 대기중</span>
            </div>
            
            <div class="overflow-y-auto p-4 log-panel h-full" id="log-container">
                <p class="text-slate-500 text-center text-sm mt-10">분석이 완료되면 이 곳에 조류 탐지 기록, 거리, 크기 정보가 출력됩니다.</p>
            </div>
        </div>
    </div>

    <script>
        const apiUrlInput = document.getElementById('api-url-input');
        const videoUpload = document.getElementById('video-upload');
        const zoomSelect = document.getElementById('zoom-level');
        const btnAnalyze = document.getElementById('btn-analyze');
        
        const resultVideo = document.getElementById('result-video');
        const emptyState = document.getElementById('empty-state');
        const loadingOverlay = document.getElementById('loading-overlay');
        
        // 진행률 UI 요소
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const loadingText = document.getElementById('loading-text');
        const loadingSpinner = document.getElementById('loading-spinner');
        
        const logContainer = document.getElementById('log-container');
        const logCount = document.getElementById('log-count');

        let selectedFile = null;

        videoUpload.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                selectedFile = e.target.files[0];
                btnAnalyze.disabled = false;
            }
        });

        btnAnalyze.addEventListener('click', () => {
            const baseUrl = apiUrlInput.value.trim();
            if (!baseUrl.startsWith('http')) return alert('올바른 서버 URL(https://...)을 입력하세요.');
            if (!selectedFile) return alert('영상을 업로드하세요.');

            // UI 상태 초기화 (로딩 시작)
            btnAnalyze.disabled = true;
            emptyState.style.display = "none";
            loadingOverlay.style.display = "flex";
            
            progressBar.style.width = "0%";
            progressBar.classList.remove('animate-pulse');
            progressText.textContent = "0%";
            loadingText.textContent = "영상을 서버로 전송 중입니다...";
            loadingSpinner.className = "fa-solid fa-cloud-arrow-up text-indigo-500 text-5xl mb-4";
            
            logContainer.innerHTML = ''; 
            logCount.textContent = '분석 중...';
            resultVideo.src = "";

            // 폼 데이터 구성
            const formData = new FormData();
            formData.append("file", selectedFile);
            formData.append("zoom", zoomSelect.value);

            // XMLHttpRequest를 통한 진행률 추적 통신
            const xhr = new XMLHttpRequest();
            xhr.open('POST', `${baseUrl}/analyze`, true);

            // [핵심] 업로드 진행률 모니터링 이벤트
            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    const percentComplete = Math.round((e.loaded / e.total) * 100);
                    progressBar.style.width = percentComplete + '%';
                    progressText.textContent = percentComplete + '%';

                    // 업로드가 완료되면 서버 분석 대기 상태로 메시지 변경
                    if (percentComplete >= 100) {
                        loadingText.textContent = "전송 완료! 서버에서 영상을 분석 및 렌더링 중입니다...";
                        loadingSpinner.className = "fa-solid fa-gear fa-spin text-emerald-400 text-5xl mb-4";
                        progressBar.classList.add('animate-pulse'); // 대기 애니메이션 추가
                        progressText.textContent = "Processing...";
                    }
                }
            });

            // 통신 완료(응답 수신) 처리
            xhr.onload = function() {
                // 상태 원복
                progressBar.classList.remove('animate-pulse');
                btnAnalyze.disabled = false;
                loadingOverlay.style.display = "none";

                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        const data = JSON.parse(xhr.responseText);
                        
                        // 영상 재생
                        resultVideo.src = `${baseUrl}${data.video_url}`;
                        resultVideo.play();
                        
                        // 로그 렌더링
                        renderLogs(data.logs);
                    } catch (err) {
                        console.error(err);
                        alert("서버 응답 파싱 중 오류가 발생했습니다.");
                        emptyState.style.display = "flex";
                    }
                } else {
                    alert(`서버 분석 오류 (HTTP ${xhr.status})\nColab 서버 로그를 확인하세요.`);
                    emptyState.style.display = "flex";
                }
            };

            // 네트워크 오류 처리
            xhr.onerror = function() {
                alert("네트워크 통신 에러가 발생했습니다. URL을 확인하거나 서버 상태를 점검하세요.");
                emptyState.style.display = "flex";
                btnAnalyze.disabled = false;
                loadingOverlay.style.display = "none";
            };

            // 전송 시작
            xhr.send(formData);
        });

        // 로그 렌더링 함수 (기존과 동일)
        function renderLogs(logs) {
            if (logs.length === 0) {
                logContainer.innerHTML = `<p class="text-slate-500 text-center text-sm mt-10">해당 영상에서 탐지된 조류가 없습니다.</p>`;
                logCount.textContent = `0건 탐지`;
                return;
            }

            let htmlString = `<div class="space-y-3">`;
            let totalDetections = 0;

            logs.forEach(log => {
                totalDetections += log.detections.length;
                htmlString += `
                    <div class="bg-slate-950 border border-slate-800 p-3 rounded-lg">
                        <div class="flex justify-between items-center mb-2 border-b border-slate-800 pb-2">
                            <span class="text-indigo-400 font-bold text-xs"><i class="fa-regular fa-clock"></i> ${log.time_sec}초 (프레임: ${log.frame})</span>
                            <span class="text-xs text-slate-400">탐지: ${log.detections.length}마리</span>
                        </div>
                `;
                
                log.detections.forEach(det => {
                    let riskColor = det.distance_m < 250 ? "text-red-400" : "text-emerald-400";
                    htmlString += `
                        <div class="flex justify-between text-xs text-slate-300 py-1">
                            <span>객체 #${det.id} [${det.confidence}%]</span>
                            <span>크기: ${det.pixel_size}px</span>
                            <span class="font-bold ${riskColor}">거리: ${det.distance_m}m</span>
                        </div>
                    `;
                });
                htmlString += `</div>`;
            });
            htmlString += `</div>`;

            logContainer.innerHTML = htmlString;
            logCount.textContent = `총 ${totalDetections}건 탐지`;
        }
    </script>
</body>
</html>
