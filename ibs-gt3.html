<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBS-PAS v5 (YOLO11x High-Speed Edge Engine)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #0b0c10; color: #c5c6c7; }
        #video-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; border-radius: 0.5rem; border: 1px solid #1f2833; }
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 10; pointer-events: none; }
        
        #radar-container { position: relative; width: 100%; aspect-ratio: 2/1; background: #001100; border-radius: 0.5rem; border: 1px solid #00ff00; overflow: hidden; }
        #radar-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; }
        .radar-scan { position: absolute; bottom: 0; left: 50%; width: 200%; height: 200%; background: conic-gradient(from 270deg at 50% 100%, rgba(0, 255, 0, 0) 0deg, rgba(0, 255, 0, 0) 60deg, rgba(0, 255, 0, 0.4) 130deg, rgba(0, 255, 0, 0) 131deg); transform-origin: 50% 100%; animation: scan 3s infinite linear; z-index: 10; pointer-events: none; transform: translateX(-50%); }
        @keyframes scan { 0% { transform: translateX(-50%) rotate(-65deg); } 50% { transform: translateX(-50%) rotate(65deg); } 100% { transform: translateX(-50%) rotate(-65deg); } }

        .gauge-container { position: relative; height: 30px; background: #1f2833; border-radius: 15px; overflow: hidden; border: 2px solid #333; margin-top: 15px; }
        .gauge-zones { display: flex; height: 100%; width: 100%; position: absolute; }
        .zone-l1 { width: 25%; background: rgba(76, 175, 80, 0.2); } 
        .zone-l2 { width: 25%; background: rgba(255, 235, 59, 0.2); } 
        .zone-l3 { width: 30%; background: rgba(255, 152, 0, 0.3); }  
        .zone-l4 { width: 20%; background: rgba(244, 67, 54, 0.5); }  
        .gauge-marker { position: absolute; top: 0; height: 100%; width: 4px; background: #fff; box-shadow: 0 0 12px #fff, 0 0 8px #66fcf1; transition: left 0.1s linear; z-index: 10; }
        
        .log-panel::-webkit-scrollbar { width: 6px; }
        .log-panel::-webkit-scrollbar-thumb { background: #45a29e; border-radius: 3px; }
        .glow-text { text-shadow: 0 0 8px currentColor; }
    </style>
</head>
<body class="min-h-screen flex flex-col p-6 items-center">

    <div class="w-full max-w-7xl grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- 좌측 메인 뷰어 -->
        <div class="lg:col-span-2 space-y-4">
            <div class="bg-[#1f2833] border border-[#45a29e] p-4 rounded-xl shadow-lg flex justify-between items-center">
                <div>
                    <h1 class="font-bold text-xl text-[#66fcf1] glow-text">IBS-PAS v5 (YOLO11x Speedup Engine)</h1>
                    <p class="text-xs text-slate-400 mt-1">프레임 스킵 및 비동기 파이프라인 적용으로 영상 지연 완화</p>
                </div>
                <div id="model-status" class="px-4 py-2 bg-amber-500/10 text-amber-400 text-sm font-bold rounded-full border border-amber-500/20">
                    <i class="fa-solid fa-spinner fa-spin mr-2"></i>엔진 다운로드 대기
                </div>
            </div>

            <!-- 대시보드 컨트롤러 -->
            <div class="bg-[#1f2833] border border-slate-700 p-4 rounded-xl flex flex-wrap gap-4 items-end">
                <div class="flex-grow">
                    <label class="block text-xs text-slate-400 font-semibold mb-1">항공 영상 업로드 (.mp4)</label>
                    <input type="file" id="video-upload" accept="video/mp4" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:bg-slate-700 file:text-[#66fcf1] hover:file:bg-slate-600 bg-[#0b0c10] border border-slate-600 rounded-md">
                </div>
                <div>
                    <label class="block text-xs text-[#66fcf1] font-semibold mb-1">운항 상태</label>
                    <select id="flight-state" class="block w-full px-4 py-2 bg-[#0b0c10] border border-slate-600 rounded-md text-sm text-white focus:outline-none">
                        <option value="CRUISE">순항 (127kts)</option>
                        <option value="TAKEOFF">이착륙/호버링 (87kts)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 font-semibold mb-1">광학 배율 (Zoom)</label>
                    <select id="zoom-level" class="block w-full px-4 py-2 bg-[#0b0c10] border border-slate-600 rounded-md text-sm text-white focus:outline-none">
                        <option value="1">1x</option><option value="2">2x</option><option value="3">3x</option>
                        <option value="5">5x</option><option value="10">10x</option>
                        <option value="15" selected>15x</option><option value="30">30x</option>
                    </select>
                </div>
                <button id="btn-analyze" disabled class="px-6 py-2 bg-[#45a29e] hover:bg-[#66fcf1] text-[#0b0c10] text-sm font-bold rounded-md disabled:opacity-50">분석 시작</button>
            </div>

            <!-- 영상 및 바운딩 박스 레이어 -->
            <div id="video-container">
                <video id="video" playsinline muted></video>
                <canvas id="canvas"></canvas>
            </div>

            <!-- 성능 지표 패널 -->
            <div class="grid grid-cols-4 gap-2 bg-[#1f2833] border border-slate-700 p-2 rounded-xl text-center">
                <div class="bg-[#0b0c10] p-2 rounded border border-slate-800">
                    <div class="text-[10px] text-slate-400">AI Latency</div>
                    <div id="metric-infer" class="font-mono text-sm font-bold text-indigo-400">0 ms</div>
                </div>
                <div class="bg-[#0b0c10] p-2 rounded border border-slate-800">
                    <div class="text-[10px] text-slate-400">Processing Rate</div>
                    <div id="metric-fps" class="font-mono text-sm font-bold text-emerald-400">0 FPS</div>
                </div>
                <div class="bg-[#0b0c10] p-2 rounded border border-slate-800">
                    <div class="text-[10px] text-slate-400">탐지 표적</div>
                    <div id="metric-birds" class="font-mono text-sm font-bold text-rose-400">0 마리</div>
                </div>
                <div class="bg-[#0b0c10] p-2 rounded border border-slate-800">
                    <div class="text-[10px] text-slate-400">동기화 상태</div>
                    <div id="metric-sync" class="font-mono text-xs font-bold text-amber-400">Sync OK</div>
                </div>
            </div>
        </div>

        <!-- 우측 HUD 및 레이더 -->
        <div class="space-y-4 flex flex-col h-full max-h-[850px]">
            <!-- 기체 글로벌 위험도 계기판 -->
            <div class="bg-[#0b0c10] border border-slate-700 p-5 rounded-xl shadow-inner transition-colors duration-500" id="global-status-box">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-sm font-bold text-[#66fcf1] uppercase"><i class="fa-solid fa-helicopter mr-2"></i>Global Aircraft Status</h3>
                    <span id="decay-timer" class="text-[10px] text-slate-500 font-mono">Decay: Standby</span>
                </div>
                
                <div class="text-center bg-[#1f2833] py-4 rounded-lg border border-slate-600" id="global-level-box">
                    <div class="text-xs text-slate-400 mb-1">현재 위험 등급 (10초 감쇠 적용)</div>
                    <div id="global-level-text" class="text-3xl font-bold text-slate-200 glow-text">Level 1 (Safe)</div>
                </div>

                <div class="gauge-container">
                    <div class="gauge-zones"><div class="zone-l1"></div><div class="zone-l2"></div><div class="zone-l3"></div><div class="zone-l4"></div></div>
                    <div id="global-marker" class="gauge-marker" style="left: 0%;"></div>
                </div>
            </div>

            <!-- 130도 FOV 레이더 디스플레이 -->
            <div class="bg-[#1f2833] border border-slate-700 p-4 rounded-xl flex flex-col">
                <h3 class="text-xs font-bold text-slate-400 mb-2"><i class="fa-solid fa-radar mr-2"></i>130° Forward Collision Radar</h3>
                <div id="radar-container">
                    <div class="radar-scan"></div>
                    <canvas id="radar-canvas"></canvas>
                </div>
                <div class="flex justify-between text-[10px] text-slate-500 mt-1">
                    <span>-65° (Left)</span><span>Center (0°)</span><span>+65° (Right)</span>
                </div>
            </div>

            <!-- 누적 위기 경보 로그 -->
            <div class="bg-[#1f2833] border border-slate-700 rounded-xl flex flex-col flex-grow overflow-hidden">
                <div class="p-4 border-b border-slate-800 bg-[#0b0c10] flex justify-between items-center">
                    <h2 class="text-sm font-bold text-[#66fcf1]"><i class="fa-solid fa-list mr-2"></i> 실시간 탐지 로그</h2>
                </div>
                <div id="alert-log" class="p-3 overflow-y-auto log-panel flex-grow space-y-2 bg-[#0b0c10]"></div>
            </div>
        </div>
    </div>

    <script>
        const CAMERA_FOV_DEG = 130; 
        const CONFIDENCE_THRESHOLD = 0.25;
        const IOU_THRESHOLD = 0.45;
        const MODEL_INPUT_SIZE = 320; // 320x320으로 리사이징하여 속도 4배 향상
        const BIRD_CLASS_INDEX = 14; 

        // 11개 분할 모델 파일 경로
        //const YOLO11X_DIR = 'yolo11x'
        const MODEL_PARTS = [
            './yolo11x/yolo11x.onnx.part0',
            './yolo11x/yolo11x.onnx.part1',
            './yolo11x/yolo11x.onnx.part2', 
            './yolo11x/yolo11x.onnx.part3',
            './yolo11x/yolo11x.onnx.part4',
            './yolo11x/yolo11x.onnx.part5', 
            './yolo11x/yolo11x.onnx.part6',
            './yolo11x/yolo11x.onnx.part7',
            './yolo11x/yolo11x.onnx.part8', 
            './yolo11x/yolo11x.onnx.part9',
            './yolo11x/yolo11x.onnx.part10'
        ];

        let session;
        let isAnalyzing = false;
        let isProcessingFrame = false; // 연산 병목 방지용 락(Lock)
        let lastDetections = [];
        
        // 10초 위험 감쇠(Decay)용 변수
        let globalRiskLevel = 1;
        let riskExpireTime = 0;
        const DECAY_STEP_MS = 3300; 

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const radarCanvas = document.getElementById('radar-canvas');
        const ctx = canvas.getContext('2d');
        const radarCtx = radarCanvas.getContext('2d');
        const btnAnalyze = document.getElementById('btn-analyze');
        
        const globalLevelBox = document.getElementById('global-level-box');
        const globalLevelText = document.getElementById('global-level-text');
        const globalMarker = document.getElementById('global-marker');
        const decayTimer = document.getElementById('decay-timer');
        const alertLog = document.getElementById('alert-log');

        const prepCanvas = document.createElement('canvas');
        prepCanvas.width = MODEL_INPUT_SIZE; 
        prepCanvas.height = MODEL_INPUT_SIZE;
        const prepCtx = prepCanvas.getContext('2d');

        // 모델 분할 다운로드 및 병합 초기화
        async function initEngine() {
            try {
                const fetchPromises = MODEL_PARTS.map(async (part) => {
                    const res = await fetch(part);
                    if (!res.ok) throw new Error("분할 모델 다운로드 실패");
                    return await res.arrayBuffer();
                });
                const buffers = await Promise.all(fetchPromises);
                
                const totalLength = buffers.reduce((acc, b) => acc + b.byteLength, 0);
                const mergedArray = new Uint8Array(totalLength);
                let offset = 0;
                for (const b of buffers) { 
                    mergedArray.set(new Uint8Array(b), offset); 
                    offset += b.byteLength; 
                }

                // WebGL/WASM 환경에서 병렬 가속 설정
                ort.env.wasm.numThreads = 4;
                session = await ort.InferenceSession.create(mergedArray.buffer, { 
                    executionProviders: ['webgl', 'wasm'] 
                });
                
                document.getElementById('model-status').innerHTML = '<i class="fa-solid fa-check mr-1"></i>엔진 준비 완료';
                document.getElementById('model-status').className = "px-4 py-2 bg-emerald-500/10 text-emerald-400 text-sm font-bold rounded-full";
                if (video.src) btnAnalyze.disabled = false;
            } catch (e) {
                console.error("엔진 초기화 실패:", e);
            }
        }
        initEngine();

        document.getElementById('video-upload').addEventListener('change', (e) => {
            if (e.target.files[0]) {
                video.src = URL.createObjectURL(e.target.files[0]);
                video.load();
                video.onloadeddata = () => {
                    canvas.width = video.videoWidth; 
                    canvas.height = video.videoHeight;
                    radarCanvas.width = radarCanvas.parentElement.clientWidth;
                    radarCanvas.height = radarCanvas.parentElement.clientHeight;
                    if (session) btnAnalyze.disabled = false;
                };
            }
        });

        btnAnalyze.addEventListener('click', () => {
            if (isAnalyzing) {
                isAnalyzing = false; 
                video.pause();
                btnAnalyze.textContent = "분석 시작";
            } else {
                isAnalyzing = true; 
                video.play();
                btnAnalyze.textContent = "분석 중지";
                renderPipeline();
            }
        });

        // 초고속 비동기 추론 파이프라인 (지연 현상 완화 핵심)
        async function processFrameAsync() {
            if (isProcessingFrame || !isAnalyzing || video.paused) return;
            isProcessingFrame = true; // 락 설정

            const startTime = performance.now();

            // 비디오의 현재 프레임을 320x320으로 급속 리사이징
            prepCtx.drawImage(video, 0, 0, MODEL_INPUT_SIZE, MODEL_INPUT_SIZE);
            const imgData = prepCtx.getImageData(0, 0, MODEL_INPUT_SIZE, MODEL_INPUT_SIZE).data;
            
            const inputBuffer = new Float32Array(3 * MODEL_INPUT_SIZE * MODEL_INPUT_SIZE);
            for (let i = 0; i < MODEL_INPUT_SIZE * MODEL_INPUT_SIZE; i++) {
                inputBuffer[i] = imgData[i*4] / 255.0;                         
                inputBuffer[MODEL_INPUT_SIZE*MODEL_INPUT_SIZE + i] = imgData[i*4+1] / 255.0;     
                inputBuffer[MODEL_INPUT_SIZE*MODEL_INPUT_SIZE*2 + i] = imgData[i*4+2] / 255.0; 
            }
            
            const tensor = new ort.Tensor('float32', inputBuffer, [1, 3, MODEL_INPUT_SIZE, MODEL_INPUT_SIZE]);
            const output = await session.run({ [session.inputNames[0]]: tensor });
            const outputData = output[session.outputNames[0]].data;
            
            const boxes = [];
            const numAnchors = 2100; // 320x320 입력 기준 앵커 수
            const classOffset = 4 + BIRD_CLASS_INDEX; 

            for (let i = 0; i < numAnchors; i++) {
                const score = outputData[classOffset * numAnchors + i];
                if (score > CONFIDENCE_THRESHOLD) {
                    const cx = outputData[0*numAnchors+i], cy = outputData[1*numAnchors+i];
                    const w = outputData[2*numAnchors+i], h = outputData[3*numAnchors+i];
                    boxes.push({ cx, cy, w, h, score });
                }
            }
            
            lastDetections = applyNMS(boxes, IOU_THRESHOLD);
            
            const inferTime = performance.now() - startTime;
            document.getElementById('metric-infer').innerText = `${inferTime.toFixed(0)} ms`;
            document.getElementById('metric-fps').innerText = `${(1000/inferTime).toFixed(1)} FPS`;
            document.getElementById('metric-birds').innerText = `${lastDetections.length} 마리`;

            isProcessingFrame = false; // 락 해제
        }

        // 실시간 렌더링 루프 (비디오 속도에 맞춰 부드럽게 출력)
        function renderPipeline() {
            if (!isAnalyzing || video.paused) return;

            // AI 연산이 비어있을 때만 새로운 프레임 분석 요청 (지연 방지)
            if (!isProcessingFrame) {
                processFrameAsync();
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            let frameMaxLevel = 1;
            let frameMinDist = 1000;
            const flightState = document.getElementById('flight-state').value;
            const zoom = parseFloat(document.getElementById('zoom-level').value);
            const Rc = (flightState === 'CRUISE') ? 192 : 220;

            let radarTargets = [];

            if (lastDetections.length > 0) {
                const scaleX = canvas.width / MODEL_INPUT_SIZE;
                const scaleY = canvas.height / MODEL_INPUT_SIZE;

                lastDetections.forEach(det => {
                    const rw = det.w * scaleX, rh = det.h * scaleY;
                    const rx = (det.cx - det.w/2) * scaleX, ry = (det.cy - det.h/2) * scaleY;
                    
                    // 1. 단안 깊이 추정 거리 역산 (배율 적용)
                    const distMeters = 500 * (100 / Math.max(rw, rh)) * (zoom / 15);
                    if (distMeters < frameMinDist) frameMinDist = distMeters;

                    // 2. 방위각 (Bearing) 계산
                    const centerPx = rx + rw/2;
                    const bearingDeg = ((centerPx / canvas.width) - 0.5) * CAMERA_FOV_DEG;
                    
                    radarTargets.push({ dist: distMeters, bearing: bearingDeg });

                    // 3. 개별 타겟 위험 등급 결정
                    let tLvl = 1, tCol = "#4caf50";
                    if (distMeters <= Rc) { tLvl = 4; tCol = "#f44336"; }
                    else if (distMeters <= 500) { tLvl = 3; tCol = "#ff9800"; }
                    else if (distMeters <= 750) { tLvl = 2; tCol = "#ffeb3b"; }
                    
                    if (tLvl > frameMaxLevel) frameMaxLevel = tLvl;

                    // 캔버스 박스 렌더링
                    ctx.strokeStyle = tCol; 
                    ctx.lineWidth = 3;
                    ctx.strokeRect(rx, ry, rw, rh);
                    
                    const label = `Bird | ${distMeters.toFixed(0)}m | ${bearingDeg.toFixed(1)}°`;
                    ctx.fillStyle = tCol; 
                    ctx.fillRect(rx, ry - 22, ctx.measureText(label).width + 10, 22);
                    ctx.fillStyle = "#000"; 
                    ctx.font = "bold 12px Pretendard"; 
                    ctx.fillText(label, rx + 5, ry - 6);
                });
            }

            // 10초 위험 감쇠 및 글로벌 상태 모니터링 업데이트
            updateDecaySystem(frameMaxLevel, frameMinDist, Rc);
            
            // 130도 레이더 업데이트
            drawRadar(radarTargets, Rc);

            requestAnimationFrame(renderPipeline);
        }

        // 10초 점진적 감쇠 (Decay) 제어 함수
        function updateDecaySystem(frameMaxLevel, frameMinDist, Rc) {
            const now = Date.now();

            if (frameMaxLevel >= globalRiskLevel) {
                globalRiskLevel = frameMaxLevel;
                if (frameMaxLevel > 1) {
                    riskExpireTime = now + DECAY_STEP_MS; // 타임스탬프 갱신
                }
            } else if (now > riskExpireTime && globalRiskLevel > 1) {
                globalRiskLevel -= 1; // 3.3초마다 1단계씩 부드럽게 감소
                riskExpireTime = now + DECAY_STEP_MS;
            }

            // 계기판 UI 업데이트
            let lvlName = "Level 1 (Safe)", col = "#4caf50", bg = "border-[#4caf50]";
            if (globalRiskLevel === 4) { lvlName="Level 4 (Critical)"; col="#f44336"; bg="border-[#f44336] bg-red-900/30"; }
            else if (globalRiskLevel === 3) { lvlName="Level 3 (Warning)"; col="#ff9800"; bg="border-[#ff9800] bg-orange-900/20"; }
            else if (globalRiskLevel === 2) { lvlName="Level 2 (Caution)"; col="#ffeb3b"; bg="border-[#ffeb3b] bg-yellow-900/20"; }

            globalLevelText.innerText = lvlName;
            globalLevelText.style.color = col;
            globalLevelBox.className = `text-center py-4 rounded-lg border transition-colors duration-300 ${bg}`;

            const gaugePct = ((1000 - Math.min(frameMinDist, 1000)) / 1000) * 100;
            globalMarker.style.left = `${gaugePct}%`;

            if (globalRiskLevel > 1) {
                const remainSec = ((riskExpireTime - now) / 1000).toFixed(1);
                decayTimer.innerText = `Decay Next: ${remainSec}s`;
            } else { 
                decayTimer.innerText = `Decay: Standby`; 
            }
        }

        // 130도 FOV 레이더 렌더링
        function drawRadar(targets, Rc) {
            const w = radarCanvas.width, h = radarCanvas.height;
            radarCtx.clearRect(0, 0, w, h);
            
            const originX = w / 2;
            const originY = h; 
            const maxR = h * 0.95; 

            // 레이더 격자 그리기
            radarCtx.strokeStyle = "rgba(0, 255, 0, 0.2)"; 
            radarCtx.lineWidth = 1;
            [0.25, 0.5, 0.75, 1.0].forEach(scale => {
                radarCtx.beginPath(); 
                radarCtx.arc(originX, originY, maxR * scale, Math.PI, 0); 
                radarCtx.stroke();
            });

            // Rc 긴급 회피 구역 (레드존)
            const rcScale = Rc / 1000;
            radarCtx.fillStyle = "rgba(244, 67, 54, 0.25)";
            radarCtx.beginPath(); 
            radarCtx.arc(originX, originY, maxR * rcScale, Math.PI, 0); 
            radarCtx.fill();

            // 타겟 플로팅
            targets.forEach(t => {
                if (t.dist > 1000) return;
                const rPx = (t.dist / 1000) * maxR;
                const angleRad = -Math.PI/2 + (t.bearing * Math.PI / 180);
                const px = originX + rPx * Math.cos(angleRad);
                const py = originY + rPx * Math.sin(angleRad);

                radarCtx.fillStyle = t.dist <= Rc ? "#f44336" : (t.dist <= 500 ? "#ff9800" : "#ffeb3b");
                radarCtx.beginPath(); 
                radarCtx.arc(px, py, 4, 0, Math.PI*2); 
                radarCtx.fill();

                // 로그 기록
                if (Math.random() < 0.03 && t.dist <= 500) {
                    const html = `<div class="text-[10px] border-b border-slate-700 py-1"><span style="color:${radarCtx.fillStyle}">[Brg: ${t.bearing.toFixed(1)}°]</span> Dist: ${t.dist.toFixed(0)}m</div>`;
                    alertLog.innerHTML = html + alertLog.innerHTML.substring(0, 1000);
                }
            });
        }

        // NMS (Non-Maximum Suppression)
        function applyNMS(boxes, iouThreshold) {
            boxes.sort((a, b) => b.score - a.score);
            const result = [];
            while (boxes.length > 0) {
                const bestBox = boxes.shift(); 
                result.push(bestBox);
                for (let i = boxes.length - 1; i >= 0; i--) {
                    const box = boxes[i];
                    const iw = Math.max(0, Math.min(bestBox.cx+bestBox.w/2, box.cx+box.w/2) - Math.max(bestBox.cx-bestBox.w/2, box.cx-box.w/2));
                    const ih = Math.max(0, Math.min(bestBox.cy+bestBox.h/2, box.cy+box.h/2) - Math.max(bestBox.cy-bestBox.h/2, box.cy-box.h/2));
                    const iou = (iw * ih) / ((bestBox.w * bestBox.h) + (box.w * box.h) - (iw * ih));
                    if (iou > iouThreshold) boxes.splice(i, 1);
                }
            }
            return result;
        }
    </script>
