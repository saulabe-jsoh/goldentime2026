<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBS-PAS Web Vision Engine (실시간 조류 탐지)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- TensorFlow.js & COCO-SSD Model -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700&family=JetBrains+Mono&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        #video-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 0.5rem; overflow: hidden; border: 1px solid #334155; }
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 10; pointer-events: none; }
        
        /* Custom Scrollbar for JSON log */
        #json-log::-webkit-scrollbar { width: 6px; }
        #json-log::-webkit-scrollbar-track { background: #1e293b; }
        #json-log::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 shadow-md z-20">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-xl shadow-lg shadow-indigo-500/20">
                    <i class="fa-solid fa-satellite-dish text-white"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">IBS-PAS Web Engine</h1>
                    <p class="text-xs text-slate-400">브라우저 기반 실시간 조류 탐지 및 비행 방향 분석</p>
                </div>
            </div>
            <div id="status-badge" class="px-3 py-1 bg-amber-500/10 text-amber-400 text-xs font-semibold rounded-full border border-amber-500/20 flex items-center gap-2">
                <i class="fa-solid fa-spinner fa-spin"></i> AI 모델 로딩중...
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto w-full p-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left Column: Video & Controls -->
        <div class="lg:col-span-2 flex flex-col gap-4">
            
            <!-- Controls -->
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex flex-wrap gap-4 items-end">
                <div class="flex-grow">
                    <label class="block text-xs text-slate-400 font-semibold mb-1">비디오 소스 선택 (MP4 업로드)</label>
                    <input type="file" id="video-upload" accept="video/mp4,video/webm" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-indigo-500/10 file:text-indigo-400 hover:file:bg-indigo-500/20 cursor-pointer bg-slate-950 border border-slate-800 rounded-md">
                </div>
                <div class="flex gap-2">
                    <button id="btn-webcam" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-semibold rounded-md transition-colors border border-slate-700">
                        <i class="fa-solid fa-camera mr-1"></i> 웹캠 사용
                    </button>
                    <button id="btn-toggle" disabled class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold rounded-md transition-colors shadow-lg shadow-emerald-600/20 disabled:opacity-50 disabled:cursor-not-allowed">
                        <i class="fa-solid fa-play mr-1"></i> 분석 시작
                    </button>
                </div>
            </div>

            <!-- Viewport -->
            <div id="video-container">
                <video id="video" playsinline muted loop></video>
                <canvas id="canvas"></canvas>
                <!-- Empty State -->
                <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 z-0">
                    <i class="fa-solid fa-video-slash text-4xl mb-3"></i>
                    <p class="text-sm">비디오 파일을 업로드하거나 웹캠을 켜주세요.</p>
                </div>
            </div>

            <!-- Metrics -->
            <div class="grid grid-cols-3 gap-4">
                <div class="bg-slate-900 border border-slate-800 p-3 rounded-lg text-center">
                    <div class="text-[10px] text-slate-400">현재 프레임 (Frame)</div>
                    <div id="metric-frame" class="font-mono font-bold text-indigo-400">0</div>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-3 rounded-lg text-center">
                    <div class="text-[10px] text-slate-400">초당 프레임 (FPS)</div>
                    <div id="metric-fps" class="font-mono font-bold text-emerald-400">0.0</div>
                </div>
                <div class="bg-slate-900 border border-slate-800 p-3 rounded-lg text-center">
                    <div class="text-[10px] text-slate-400">탐지된 조류 객체 수</div>
                    <div id="metric-birds" class="font-mono font-bold text-amber-400">0</div>
                </div>
            </div>
        </div>

        <!-- Right Column: JSON Payload Telemetry -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl flex flex-col h-full max-h-[800px] overflow-hidden">
            <div class="p-3 border-b border-slate-800 bg-slate-950 flex justify-between items-center">
                <h2 class="text-sm font-bold text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-code text-indigo-400"></i> 실시간 JSON 페이로드
                </h2>
                <span class="relative flex h-2 w-2">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                </span>
            </div>
            <pre id="json-log" class="p-4 overflow-y-auto text-xs font-mono text-indigo-300 h-full leading-relaxed"></pre>
        </div>

    </main>

    <script>
        // --- 1. 단순 객체 추적기 (Centroid Tracking) 구현 ---
        // 프레임 간 바운딩 박스를 연결하여 ID를 부여하고, 면적 변화를 계산하는 자바스크립트 클래스입니다.
        class BirdTracker {
            constructor() {
                this.tracks = {}; 
                this.nextId = 1;
                this.historyCompareFrames = 5;
            }

            update(detections) {
                let currentTrackIds = Object.keys(this.tracks);
                let updatedTracks = {};

                detections.forEach(det => {
                    // [x, y, width, height]
                    let cx = det.bbox[0] + det.bbox[2] / 2;
                    let cy = det.bbox[1] + det.bbox[3] / 2;
                    let area = det.bbox[2] * det.bbox[3];

                    let bestId = null;
                    let minDist = Infinity;

                    // 유클리디안 거리 기반 가장 가까운 이전 객체 찾기
                    for (let id of currentTrackIds) {
                        let track = this.tracks[id];
                        let dist = Math.hypot(cx - track.cx, cy - track.cy);
                        // 거리가 100픽셀 이내면 같은 새(객체)로 간주
                        if (dist < 100 && dist < minDist) {
                            minDist = dist;
                            bestId = id;
                        }
                    }

                    if (bestId) {
                        // 기존 추적 객체 업데이트
                        this.tracks[bestId].cx = cx;
                        this.tracks[bestId].cy = cy;
                        this.tracks[bestId].history.push(area);
                        if (this.tracks[bestId].history.length > 20) {
                            this.tracks[bestId].history.shift(); // 최대 20프레임 기록
                        }
                        updatedTracks[bestId] = this.tracks[bestId];
                        det.trackId = bestId;
                        currentTrackIds = currentTrackIds.filter(id => id !== bestId);
                    } else {
                        // 새로운 객체 발생
                        let newId = this.nextId++;
                        updatedTracks[newId] = { cx, cy, history: [area] };
                        det.trackId = newId;
                    }
                });

                this.tracks = updatedTracks; // 화면에서 사라지면 즉시 삭제 (메모리 관리)
                return detections;
            }

            // 바운딩 박스 면적(Area) 델타 비교로 정방향/후방향 판단
            getDirection(trackId, currentArea) {
                let history = this.tracks[trackId].history;
                if (history.length < this.historyCompareFrames) return "분석 대기";
                
                let oldArea = history[history.length - this.historyCompareFrames];
                let ratio = currentArea / (oldArea + 1e-5);
                
                if (ratio > 1.05) return "정방향 [접근]";
                if (ratio < 0.95) return "후방향 [멀어짐]";
                return "횡단/순항";
            }
        }

        // --- 2. 전역 변수 및 DOM 요소 ---
        let model = null;
        let isAnalyzing = false;
        let animationId = null;
        let frameCount = 0;
        let lastTime = performance.now();
        const tracker = new BirdTracker();

        const videoEl = document.getElementById('video');
        const canvasEl = document.getElementById('canvas');
        const ctx = canvasEl.getContext('2d');
        
        const btnToggle = document.getElementById('btn-toggle');
        const btnWebcam = document.getElementById('btn-webcam');
        const uploadEl = document.getElementById('video-upload');
        const emptyState = document.getElementById('empty-state');
        const jsonLog = document.getElementById('json-log');
        const statusBadge = document.getElementById('status-badge');

        // --- 3. TensorFlow.js COCO-SSD 모델 로딩 ---
        async function loadModel() {
            try {
                // 웹 브라우저에서 경량화된 실시간 객체 탐지 모델 로드
                model = await cocoSsd.load();
                
                statusBadge.innerHTML = `<i class="fa-solid fa-check"></i> AI 모델 준비 완료`;
                statusBadge.className = "px-3 py-1 bg-emerald-500/10 text-emerald-400 text-xs font-semibold rounded-full border border-emerald-500/20 flex items-center gap-2";
                
                if (videoEl.srcObject || videoEl.src) {
                    btnToggle.disabled = false;
                }
            } catch (err) {
                statusBadge.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> 로딩 실패`;
                statusBadge.className = "px-3 py-1 bg-red-500/10 text-red-400 text-xs font-semibold rounded-full border border-red-500/20 flex items-center gap-2";
                console.error("모델 로딩 에러:", err);
            }
        }
        loadModel();

        // --- 4. 비디오 소스 설정 (파일 업로드 & 웹캠) ---
        uploadEl.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                videoEl.srcObject = null;
                videoEl.src = fileURL;
                videoEl.load();
                videoEl.onloadeddata = () => setupVideoReady();
            }
        });

        btnWebcam.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                videoEl.src = "";
                videoEl.srcObject = stream;
                videoEl.onloadeddata = () => setupVideoReady();
            } catch (err) {
                alert("웹캠 접근 권한이 없거나 지원되지 않습니다.");
            }
        });

        function setupVideoReady() {
            emptyState.style.display = "none";
            canvasEl.width = videoEl.videoWidth;
            canvasEl.height = videoEl.videoHeight;
            if (model) btnToggle.disabled = false;
        }

        // --- 5. 분석 시작/중지 토글 ---
        btnToggle.addEventListener('click', () => {
            if (!isAnalyzing) {
                isAnalyzing = true;
                videoEl.play();
                btnToggle.innerHTML = `<i class="fa-solid fa-stop mr-1"></i> 분석 중지`;
                btnToggle.className = "px-6 py-2 bg-red-600 hover:bg-red-500 text-white text-sm font-bold rounded-md transition-colors shadow-lg shadow-red-600/20";
                processFrame();
            } else {
                isAnalyzing = false;
                videoEl.pause();
                btnToggle.innerHTML = `<i class="fa-solid fa-play mr-1"></i> 분석 재개`;
                btnToggle.className = "px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold rounded-md transition-colors shadow-lg shadow-emerald-600/20";
                cancelAnimationFrame(animationId);
            }
        });

        // --- 6. 핵심 탐지 및 JSON 생성 루프 ---
        async function processFrame() {
            if (!isAnalyzing) return;

            // 캔버스 크기 맞춤
            if (canvasEl.width !== videoEl.videoWidth) {
                canvasEl.width = videoEl.videoWidth;
                canvasEl.height = videoEl.videoHeight;
            }

            const now = performance.now();
            const dt = now - lastTime;
            lastTime = now;
            frameCount++;

            // 객체 탐지 실행
            const predictions = await model.detect(videoEl);
            
            // 'bird' 클래스만 필터링 (COCO-SSD는 80개 클래스 지원, 'bird' 포함)
            const birds = predictions.filter(p => p.class === 'bird' && p.score > 0.3);
            
            // 객체 추적 (ID 할당)
            const trackedBirds = tracker.update(birds);

            // 캔버스 초기화
            ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
            
            const payloadArray = [];
            const timestamp = new Date().toISOString();

            trackedBirds.forEach(bird => {
                const [x, y, width, height] = bird.bbox;
                const currentArea = width * height;
                const trackId = bird.trackId;
                
                // 방향 분석 알고리즘
                const direction = tracker.getDirection(trackId, currentArea);

                // 색상 지정
                let color = '#3b82f6'; // 파랑 (순항)
                if (direction.includes('접근')) color = '#ef4444'; // 빨강
                if (direction.includes('멀어짐')) color = '#10b981'; // 초록

                // 바운딩 박스 그리기
                ctx.strokeStyle = color;
                ctx.lineWidth = 3;
                ctx.strokeRect(x, y, width, height);
                
                // 텍스트 라벨 그리기
                const labelText = `ID:${trackId} ${direction}`;
                ctx.fillStyle = color;
                ctx.font = '16px Pretendard';
                const textWidth = ctx.measureText(labelText).width;
                ctx.fillRect(x, y - 24, textWidth + 10, 24);
                ctx.fillStyle = '#ffffff';
                ctx.fillText(labelText, x + 5, y - 7);

                // JSON 페이로드용 데이터 구성
                payloadArray.push({
                    track_id: trackId,
                    class: "bird",
                    confidence: parseFloat(bird.score.toFixed(3)),
                    bbox: { 
                        cx: Math.round(x + width/2), 
                        cy: Math.round(y + height/2), 
                        width: Math.round(width), 
                        height: Math.round(height) 
                    },
                    direction: direction,
                    area_px: Math.round(currentArea)
                });
            });

            // JSON 페이로드 구조화
            const payload = {
                timestamp: timestamp,
                frame_id: frameCount,
                total_birds_detected: payloadArray.length,
                detections: payloadArray
            };

            // UI 매트릭스 업데이트
            document.getElementById('metric-frame').innerText = frameCount;
            document.getElementById('metric-fps').innerText = (1000 / dt).toFixed(1);
            document.getElementById('metric-birds').innerText = payloadArray.length;

            // JSON 로그 패널에 렌더링 (최신 데이터가 위로 오도록)
            const jsonString = JSON.stringify(payload, null, 2);
            jsonLog.textContent = jsonString + "\n\n" + jsonLog.textContent.substring(0, 5000); // 메모리 방지 컷

            // 다음 프레임 요청 (Real-time 루프)
            animationId = requestAnimationFrame(processFrame);
        }
    </script>
</body>
</html>
